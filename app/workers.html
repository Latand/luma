class LumaCapture extends AudioWorkletProcessor {
  constructor() {
    super();
    this.pipe = null; this.index = 0; this.chunkSize = Math.max(256, Math.round(sampleRate * .021333 / 128) * 128); this.chunk = new Float32Array(this.chunkSize); this.start = 0;
    this.port.onmessage = (event) => {
      if (event.data.type === 'connect') { this.pipe = event.data.port; this.pipe.start(); }
    };
  }
  process(inputs, outputs) {
    const channels = inputs[0];
    if (!channels || !channels.length || !this.pipe) return true;
    const n = channels[0].length;
    for (let i = 0; i < n; i++) {
      if (this.index === 0) this.start = (currentFrame + i) / sampleRate;
      let sample = 0;
      for (let ch = 0; ch < channels.length; ch++) sample += channels[ch][i];
      this.chunk[this.index++] = sample / channels.length;
      if (this.index === this.chunk.length) {
        this.pipe.postMessage({ type: 'pcm', samples: this.chunk, t0: this.start }, [this.chunk.buffer]);
        this.chunk = new Float32Array(this.chunkSize); this.index = 0;
      }
    }
    // All outputs stay zero. Connecting this node to destination does NOT monitor the microphone.
    return true;
  }
}
registerProcessor('luma-capture', LumaCapture);

class BiquadLP {

  next(x) {
